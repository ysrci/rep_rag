[project]
name = "RAG"
version = "0.1.0"
description = "RAG Project has been created as part of the 42 curriculum by adkhalil."
readme = "README.md"
authors = [
    { name = "adkhalil", email = "adkhalil@student.1337.ma" }
]
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.12",
    "faiss-cpu>=1.15.1",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "langchain-text-splitters>=1.1.3",
    "mypy>=2.3.1",
    "path>=17.1.1",
    "pathlib>=1.0.1",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
ignore_missing_imports = true
